[project]
name = "bakcend"
version = "0.1.0"
description = "forecast_backend"
authors = [
    {name = "Nikita Savvin", email = "nikita.vsav@gmail.com"},
]
dependencies = [
    "pytest>=8.4.0",
    "tox==4.14.2",
    "pre-commit>=3.6.2",
    "pytest-cov>=4.1.0",
    "coverage-badge>=1.1.0",
    "pdm-bump>=0.7.3",
    "pydantic>=2.6.3",
    "fastapi>=0.110.0",
    "uvicorn>=0.34.0",
    "pandas>=2.3.0",
    "coverage==7.4.4",
    "scipy>=1.15.2",
    "statsmodels>=0.14.2",
    "tensorflow>=2.16.2",
    "holidays>=0.57",
    "scikit-learn>=1.5.2",
    "xgboost>=3.0.2",
    "ephem>=4.2",
    "python-dateutil>=2.9.0.post0",
    "tqdm>=4.67.1",
    "psycopg2-binary>=2.9.10",
    "optuna>=4.3.0",
    "plotly>=6.1.2",
    "requests>=2.32.3",
    "setuptools>=80.9.0",
    "pyyaml>=6.0.2",
    "pytest-timeout>=2.4.0",
]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
test = [
    "fastapi-cprofile>=0.0.2",
]
[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests",
]
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit_transform",
]
pythonpath = [
    "src",
]
